<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BACCHUS 10秒チャレンジ</title>

<style>

body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial, sans-serif;

    height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

/* タイトル */
h1{
    margin:0;
    font-size:64px;
    font-weight:bold;
    letter-spacing:2px;
}

/* by BACCHUS */
#subTitle{
    margin-top:8px;
    margin-bottom:45px;

    font-size:22px;
    letter-spacing:5px;

    color:#777;
}

/* タイマー */
#timer{
    font-size:190px;
    font-weight:bold;
    line-height:1;
}

/* 判定 */
#result{
    height:80px;
    margin-top:30px;

    font-size:50px;
    font-weight:bold;
}

/* ボタン */
button{
    margin-top:35px;

    width:310px;
    height:120px;

    border:none;
    border-radius:28px;

    background:#ff0000;
    color:white;

    font-size:56px;
    font-weight:bold;

    cursor:pointer;

    transition:0.15s;
}

button:active{
    transform:scale(0.96);
}

/* 判定カラー */

.god{
    color:#00ff66;
    text-shadow:0 0 25px #00ff66;
}

.near{
    color:#ffd400;
    text-shadow:0 0 20px #ffd400;
}

.good{
    color:#ff9900;
}

.miss{
    color:#ff5555;
}

.bad{
    color:#888;
}

/* 右下フルスクリーンエリア */

#fullscreen-area{
    position:fixed;

    right:0;
    bottom:0;

    width:120px;
    height:120px;

    opacity:0.03;
}

</style>
</head>

<body>

<h1>10秒チャレンジ</h1>

<div id="subTitle">by BACCHUS</div>

<div id="timer">0.000</div>

<div id="result"></div>

<button id="mainBtn">START</button>

<div id="fullscreen-area"></div>

<script>

const timer = document.getElementById("timer");
const result = document.getElementById("result");
const mainBtn = document.getElementById("mainBtn");

let running = false;
let startTime = 0;
let interval = null;
let tickInterval = null;

let audioCtx = null;

/* ---------- Audio ---------- */

function getAudio(){

    if(!audioCtx){

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    return audioCtx;
}

function beep(freq, duration, volume = 0.12){

    const ctx = getAudio();

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "square";
    osc.frequency.value = freq;

    osc.connect(gain);
    gain.connect(ctx.destination);

    gain.gain.setValueAtTime(volume, ctx.currentTime);

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + duration
    );

    osc.start();
    osc.stop(ctx.currentTime + duration);
}

/* 開始音 */

function startSound(){

    beep(650,0.08,0.12);

    setTimeout(()=>{

        beep(850,0.08,0.12);

    },90);

    setTimeout(()=>{

        beep(1100,0.10,0.12);

    },180);
}

/* カウント音 */

function tickSound(){

    beep(950,0.025,0.035);
}

/* 停止音 */

function stopSound(){

    beep(260,0.12,0.14);
}

/* 神 */

function godSound(){

    beep(900,0.08,0.16);

    setTimeout(()=>{

        beep(1200,0.08,0.16);

    },90);

    setTimeout(()=>{

        beep(1500,0.15,0.16);

    },180);
}

/* ニア */

function nearSound(){

    beep(900,0.08,0.13);

    setTimeout(()=>{

        beep(1100,0.10,0.13);

    },100);
}

/* ハズレ */

function badSound(){

    beep(180,0.18,0.14);
}

/* ---------- 判定 ---------- */

function judge(time){

    const diff = Math.abs(10 - time);

    result.className = "";

    if(diff <= 0.005){

        result.textContent = "神！！";
        result.className = "god";

        godSound();

    }else if(diff <= 0.050){

        result.textContent = "ニアピン！";
        result.className = "near";

        nearSound();

    }else if(diff <= 0.150){

        result.textContent = "かなり惜しい！";
        result.className = "good";

        nearSound();

    }else if(diff <= 0.300){

        result.textContent = "惜しい！";
        result.className = "miss";

        stopSound();

    }else{

        result.textContent = "まだまだ！";
        result.className = "bad";

        badSound();
    }
}

/* ---------- START ---------- */

function startGame(){

    running = true;

    startTime = Date.now();

    timer.textContent = "0.000";

    result.textContent = "";
    result.className = "";

    mainBtn.textContent = "STOP";

    startSound();

    interval = setInterval(()=>{

        const current =
            (Date.now() - startTime) / 1000;

        timer.textContent = current.toFixed(3);

    },10);

    tickInterval = setInterval(()=>{

        if(running){

            tickSound();
        }

    },500);
}

/* ---------- STOP ---------- */

function stopGame(){

    running = false;

    clearInterval(interval);
    clearInterval(tickInterval);

    mainBtn.textContent = "START";

    const finalTime =
        parseFloat(timer.textContent);

    judge(finalTime);
}

/* ---------- TOGGLE ---------- */

function toggleGame(){

    if(running){

        stopGame();

    }else{

        startGame();
    }
}

/* ボタン */

mainBtn.addEventListener(
    "click",
    toggleGame
);

/* スペースキー */

document.addEventListener(
    "keydown",
    (e)=>{

        if(e.code === "Space"){

            e.preventDefault();

            toggleGame();
        }
    }
);

/* 右下フルスクリーン */

document
.getElementById("fullscreen-area")
.addEventListener("click",()=>{

    if(!document.fullscreenElement){

        document.documentElement.requestFullscreen();

    }else{

        document.exitFullscreen();
    }
});

</script>

</body>
</html>
