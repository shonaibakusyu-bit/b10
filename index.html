<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BACCHUS 10秒チャレンジ</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:sans-serif;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;

    text-align:center;
}

.container{

    width:100%;
    max-width:700px;

    padding:20px;
}

h1{

    font-size:64px;
    font-weight:900;

    margin-bottom:8px;

}

.sub{

    font-size:18px;
    letter-spacing:5px;

    color:#888;

    margin-bottom:30px;
}

#timer{

    font-size:170px;
    font-weight:900;

    line-height:1;

    margin-bottom:25px;

    text-shadow:
        0 0 10px rgba(255,255,255,0.15);

}

#message{

    min-height:70px;

    font-size:52px;
    font-weight:900;

    margin-bottom:30px;

    color:#888;
}

#startBtn{

    border:none;

    background:#ff2200;
    color:#fff;

    font-size:54px;
    font-weight:900;

    padding:24px 70px;

    border-radius:24px;

    cursor:pointer;

    box-shadow:
        0 0 15px rgba(255,0,0,0.5),
        0 0 35px rgba(255,0,0,0.35);

    transition:0.1s;
}

#startBtn:active{

    transform:scale(0.96);

}

canvas{

    position:fixed;
    top:0;
    left:0;

    pointer-events:none;
}

.flash{

    animation:flashBg 0.12s alternate 10;

}

@keyframes flashBg{

    from{
        background:#000;
    }

    to{
        background:#00ff66;
    }

}

.rainbow{

    animation:rainbow 1s linear infinite;

}

@keyframes rainbow{

    0%{color:#ff0000;}
    20%{color:#ffff00;}
    40%{color:#00ff00;}
    60%{color:#00ffff;}
    80%{color:#ff00ff;}
    100%{color:#ff0000;}

}

@media(max-width:768px){

    h1{

        font-size:44px;

    }

    .sub{

        font-size:15px;

        margin-bottom:20px;
    }

    #timer{

        font-size:105px;

        margin-bottom:20px;
    }

    #message{

        font-size:34px;

        margin-bottom:20px;

        min-height:45px;
    }

    #startBtn{

        font-size:38px;

        padding:20px 45px;
    }

}

</style>
</head>

<body>

<canvas id="confetti"></canvas>

<div class="container">

    <h1>10秒チャレンジ</h1>

    <div class="sub">by BACCHUS</div>

    <div id="timer">0.00</div>

    <div id="message">READY?</div>

    <button id="startBtn">START</button>

</div>

<script>

const timerEl = document.getElementById("timer");
const msgEl = document.getElementById("message");
const startBtn = document.getElementById("startBtn");

let running = false;
let startTime;
let interval;

//
// Audio
//
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

//
// テッテッテッテ音
//
function tickSound(){

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.type = "square";

    osc.frequency.value = 950;

    gain.gain.value = 0.018;

    osc.start();

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + 0.04
    );

    osc.stop(audioCtx.currentTime + 0.04);

}

//
// 成功音
//
function successSound(){

    for(let i=0;i<10;i++){

        setTimeout(()=>{

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = "triangle";

            osc.frequency.value = 700 + (i * 70);

            gain.gain.value = 0.04;

            osc.start();

            setTimeout(()=>{
                osc.stop();
            },120);

        },i*60);

    }

}

//
// 紙吹雪
//
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let confetti = [];

function createConfetti(){

    confetti = [];

    for(let i=0;i<250;i++){

        confetti.push({

            x:Math.random()*canvas.width,
            y:Math.random()*canvas.height - canvas.height,

            size:6 + Math.random()*10,

            speed:2 + Math.random()*5,

            color:`hsl(${Math.random()*360},100%,50%)`,

            rotate:Math.random()*360

        });

    }

    animateConfetti();

}

function animateConfetti(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    confetti.forEach(c=>{

        ctx.save();

        ctx.translate(c.x,c.y);

        ctx.rotate(c.rotate);

        ctx.fillStyle = c.color;

        ctx.fillRect(0,0,c.size,c.size);

        ctx.restore();

        c.y += c.speed;
        c.rotate += 0.1;

    });

    requestAnimationFrame(animateConfetti);

}

//
// タイマー
//
function toggleTimer(){

    if(!running){

        audioCtx.resume();

        running = true;

        startTime = performance.now();

        msgEl.textContent = "...";
        msgEl.className = "";
        msgEl.style.color = "#888";

        startBtn.textContent = "STOP";

        interval = setInterval(()=>{

            const elapsed = (performance.now() - startTime) / 1000;

            timerEl.textContent = elapsed.toFixed(2);

            //
            // テッテッテッテ
            //
            tickSound();

        },50);

    }else{

        running = false;

        clearInterval(interval);

        startBtn.textContent = "START";

        const finalTime = parseFloat(timerEl.textContent);

        judge(finalTime);

    }

}

//
// 判定
//
function judge(time){

    const diff = Math.abs(time - 10.00);

    //
    // 神
    //
    if(diff <= 0.00){

        msgEl.textContent = "神！！！";

        msgEl.className = "rainbow";

        document.body.classList.add("flash");

        createConfetti();

        successSound();

        if(navigator.vibrate){

            navigator.vibrate([200,100,200,100,300]);

        }

        setTimeout(()=>{
            document.body.classList.remove("flash");
        },1500);

    }

    //
    // 神ニアピン
    // ±0.01
    //
    else if(diff <= 0.01){

        msgEl.textContent = "神ニアピン！！！";

        msgEl.style.color = "#00ffee";

        createConfetti();

        successSound();

    }

    //
    // めっちゃ惜しい
    // ±0.05
    //
    else if(diff <= 0.05){

        msgEl.textContent = "めっちゃ惜しい！！";

        msgEl.style.color = "#ffe600";

    }

    //
    // 惜しい
    // ±0.10
    //
    else if(diff <= 0.10){

        msgEl.textContent = "惜しい！";

        msgEl.style.color = "#ff5555";

    }

    //
    // まだまだ
    //
    else{

        msgEl.textContent = "まだまだ！";

        msgEl.style.color = "#888";

    }

}

//
// ボタン
//
startBtn.addEventListener("click",toggleTimer);

//
// スペースキー
//
document.addEventListener("keydown",(e)=>{

    if(e.code === "Space"){

        e.preventDefault();

        toggleTimer();

    }

});

//
// Dキーで10.00強制テスト
//
document.addEventListener("keydown",(e)=>{

    if(e.key === "d" || e.key === "D"){

        running = false;

        clearInterval(interval);

        timerEl.textContent = "10.00";

        judge(10.00);

    }

});

</script>

</body>
</html>
